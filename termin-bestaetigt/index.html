<script>/* Einstieg: leitet je Linie auf die eigene Seite und nimmt alle anderen Parameter (Calendly: invitee_uuid, event_start_time, answer_N ...) mit */(function(){var ok={leadgen:1,recruiting:1,website:1},l='',r=[];location.search.replace(/^\?/,'').split('&').forEach(function(p){if(!p)return;if(/^linie=/i.test(p)){try{l=decodeURIComponent(p.slice(6)).toLowerCase()}catch(e){}}else r.push(p)});if(!ok[l])l='website';location.replace('/termin-bestaetigt/'+l+'/'+(r.length?'?'+r.join('&'):'')+location.hash)})();</script></head>
