name = "handwerksmanufaktur-onboarding"
main = "src/index.js"
compatibility_date = "2025-01-01"

# 📥 Onboarding-Eingang (10.11.2026, ClickUp raus): jede Formular-Abgabe als Rohsatz in der EIGENEN D1
# `onboarding-eingang` (Tabelle onboarding_eingang, Schema schema.sql; der Worker legt sie auch selbst an).
# Abholer auf dem Mac: system/scripts/onboarding_eingang.py (CEO-GPT) → Kunde + Projekte in der Grundlage.
# Einmalig: npx wrangler d1 create onboarding-eingang → database_id unten eintragen (Platzhalter ersetzen).
[[d1_databases]]
binding = "EINGANG_DB"
database_name = "onboarding-eingang"
database_id = "4689f378-68a6-4ef2-8426-92af485ade62"

# Secrets werden per CLI gesetzt – niemals hier eintragen:
# wrangler secret put GOOGLE_CLIENT_EMAIL
# wrangler secret put GOOGLE_PRIVATE_KEY

# 🎁 Konzept-Anfragen (29.09.2026): jede Anfrage von /konzept landet zusätzlich in der run-db
# (Tabelle konzept_anfragen, Schema in system/apps/run/schema.sql) — Datenbasis „Anfragen je Kanal".
# Secrets dafür: CLOSE_API_KEY, KONZEPT_SALT (RESEND_API_KEY ist schon gesetzt).
[[d1_databases]]
binding = "RUN_DB"
database_name = "run-db"
database_id = "cf95c7ba-86cb-4923-9be7-63eb7e3f50aa"
